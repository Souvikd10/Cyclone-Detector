[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cyclone-ai"
version = "0.1.0"
description = "AI/ML pipeline for tropical cyclone detection, tracking, and intensity prediction using INSAT satellite data"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "SIH2k26 Team"}]

dependencies = [
    # Deep Learning
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=0.9.12",
    "segmentation-models-pytorch>=0.3.3",
    "xgboost>=2.0.0",
    "captum>=0.7.0",

    # Geospatial & Data
    "xarray>=2023.10.0",
    "netCDF4>=1.6.5",
    "rasterio>=1.3.9",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",

    # Data handling
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "h5py>=3.10.0",
    "Pillow>=10.0.0",

    # Experiment tracking
    "mlflow>=2.9.0",

    # Object storage
    "minio>=7.2.0",

    # Config & utils
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
satellite = [
    "satpy>=0.45.0",
]

[tool.setuptools.packages.find]
include = ["cyclone_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
