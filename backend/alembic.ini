# Alembic configuration for SIH-2K26

[alembic]
script_location = alembic
prepend_sys_path = .
# [dev note: sqlalchemy.url is dynamically loaded from config.py / env vars in env.py]
sqlalchemy.url = postgresql://cyclone:your_password_here@localhost:5432/cyclone_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
