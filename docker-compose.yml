version: "3.9"

services:
  # ──────────────────────────────────────────────
  # PostgreSQL + PostGIS
  # ──────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: sih2k26-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyclone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cyclone_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyclone} -d ${POSTGRES_DB:-cyclone_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # MinIO — S3-compatible object storage
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: sih2k26-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO bucket initializer (runs once)
  minio-init:
    image: minio/mc:latest
    container_name: sih2k26-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/satellite-imagery;
        mc mb --ignore-existing local/storm-masks;
        mc mb --ignore-existing local/model-checkpoints;
        mc mb --ignore-existing local/predictions;
        echo 'MinIO buckets initialized';
      "

  # ──────────────────────────────────────────────
  # MLflow — experiment tracking
  # ──────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: sih2k26-mlflow
    restart: unless-stopped
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5001
        --backend-store-uri postgresql://${POSTGRES_USER:-cyclone}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cyclone_db}
        --default-artifact-root s3://model-checkpoints/
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MLFLOW_PORT:-5001}:5001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Prefect — workflow orchestration
  # ──────────────────────────────────────────────
  prefect:
    image: prefecthq/prefect:3-latest
    container_name: sih2k26-prefect
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-cyclone}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cyclone_db}
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    depends_on:
      db:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # FastAPI application
  # ──────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih2k26-api
    restart: unless-stopped
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyclone}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cyclone_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-cyclone}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cyclone_db}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5001
      PREFECT_API_URL: http://prefect:4200/api
      ENVIRONMENT: development
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
